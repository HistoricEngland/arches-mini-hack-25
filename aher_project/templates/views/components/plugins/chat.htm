{% load i18n %}
<!-- ko if: ready() -->
<div class="chat-plugin-container" role="region" aria-label="{% trans 'Chat Interface' %}">
    <div class="chat-header" role="toolbar">
        <button class="btn btn-danger btn-sm" 
                data-bind="click: confirmClearChat"
                aria-label="{% trans 'Clear chat history' %}">
            <i class="fa fa-trash" aria-hidden="true"></i> 
            <span>{% trans 'Clear Chat' %}</span>
        </button>
    </div>
    
    <div class="chat-messages" 
         data-bind="foreach: messages" 
         role="log" 
         aria-live="polite" 
         aria-label="{% trans 'Chat messages' %}">
        <div class="chat-message" 
             data-bind="css: role"
             role="article">
            <div class="message-avatar" aria-hidden="true">
                <!-- ko if: role === 'assistant' -->
                <i class="fa fa-robot"></i>
                <!-- /ko -->
                <!-- ko if: role === 'user' -->
                <i class="fa fa-user"></i>
                <!-- /ko -->
            </div>
            <div class="message-bubble">
                <div class="message-content" 
                     data-bind="html: content"
                     role="region"
                     aria-label="{% trans 'Message from' %} " + role></div>
            </div>
        </div>
    </div>

    <!-- ko if: loading -->
    <div class="chat-message assistant" role="status" aria-live="polite">
        <div class="message-avatar" aria-hidden="true">
            <i class="fa fa-robot"></i>
        </div>
        <div class="message-bubble">
            <div class="typing-indicator" aria-label="{% trans 'Assistant is typing' %}">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>
    <!-- /ko -->
    
    <div class="chat-input" role="form" aria-label="{% trans 'Message input' %}">
        <textarea data-bind="value: userInput, 
                           valueUpdate: 'afterkeydown', 
                           event: { 
                               keypress: handleKeyPress,
                               input: autoGrowTextarea 
                           }" 
                  placeholder="{% trans 'Type your message here...' %}"
                  class="form-control"
                  rows="1"
                  role="textbox"
                  aria-label="{% trans 'Message input field' %}"
                  aria-multiline="true"></textarea>
        <button class="btn btn-primary" 
                data-bind="click: sendMessage, 
                          enable: canSend,
                          attr: { 'aria-disabled': !canSend() }"
                aria-label="{% trans 'Send message' %}">
            <i class="fa fa-paper-plane" aria-hidden="true"></i>
            <span class="sr-only">{% trans 'Send' %}</span>
        </button>
    </div>
</div>
<!-- /ko -->

{% block css %}
<style>
    .chat-plugin-container {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 15px;
        background-color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
        max-width: 100%;
        margin: 0 auto;
    }

    @media (min-width: 768px) {
        .chat-plugin-container {
            max-width: 95%;
            min-width: 95%;
        }
    }

    @media (min-width: 1200px) {
        .chat-plugin-container {
            max-width: 90%;
            min-width: 90%;
        }
    }

    @media (min-width: 1600px) {
        .chat-plugin-container {
            max-width: 95%;
            min-width: 95%;
        }
    }

    @media (min-width: 2000px) {
        .chat-plugin-container {
            max-width: 98%;
            min-width: 98%;
        }
    }

    .chat-header {
        margin-bottom: 20px;
        text-align: right;
        border-bottom: 1px solid #e0e0e0;
        padding-bottom: 15px;
    }

    .chat-messages {
        flex: 1;
        overflow-y: auto;
        margin-bottom: 20px;
        padding-right: 10px;
        -webkit-overflow-scrolling: touch;
    }

    .chat-message {
        display: flex;
        align-items: flex-start;
        margin-bottom: 20px;
        gap: 12px;
        max-width: 100%;
    }

    @media (max-width: 480px) {
        .chat-message {
            gap: 8px;
        }

        .message-avatar {
            width: 30px;
            height: 30px;
            font-size: 14px;
        }
    }

    .message-avatar {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 16px;
    }

    .chat-message.assistant .message-avatar {
        background-color: #10a37f;
        color: white;
    }

    .chat-message.user .message-avatar {
        background-color: #1e88e5;
        color: white;
    }

    .message-bubble {
        max-width: 85%;
        padding: 12px 16px;
        border-radius: 12px;
        position: relative;
        word-wrap: break-word;
        overflow-wrap: break-word;
    }

    @media (max-width: 480px) {
        .message-bubble {
            max-width: 80%;
            padding: 10px 12px;
        }
    }

    .chat-message.user {
        flex-direction: row-reverse;
    }

    .chat-message.user .message-bubble {
        background-color: #1e88e5;
        color: white;
        border-bottom-right-radius: 4px;
    }

    .chat-message.assistant .message-bubble {
        background-color: #f8f9fa;
        border: 1px solid #e0e0e0;
        border-bottom-left-radius: 4px;
    }

    .message-content {
        line-height: 1.5;
        white-space: pre-wrap;
        font-size: 16px;
    }

    @media (max-width: 480px) {
        .message-content {
            font-size: 14px;
        }
    }

    .chat-message.assistant .message-content pre {
        background-color: #ffffff;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        padding: 12px;
        margin: 8px 0;
        overflow-x: auto;
        max-width: 100%;
        font-size: 14px;
    }

    .chat-input {
        display: flex;
        gap: 10px;
        background-color: #ffffff;
        padding: 15px;
        border-top: 1px solid #e0e0e0;
        position: relative;
    }

    @media (max-width: 480px) {
        .chat-input {
            padding: 10px;
            gap: 8px;
        }
    }

    .chat-input textarea {
        flex: 1;
        resize: none;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #e0e0e0;
        font-size: 14px;
        line-height: 1.4;
        max-height: 200px;
        transition: all 0.2s ease;
        min-height: 44px;
    }

    .chat-input textarea:focus {
        border-color: #1e88e5;
        box-shadow: 0 0 0 2px rgba(30, 136, 229, 0.2);
        outline: none;
    }

    .chat-input button {
        align-self: flex-end;
        padding: 10px 16px;
        border-radius: 8px;
        transition: all 0.2s ease;
        min-height: 44px;
        min-width: 44px;
    }

    .chat-input button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    /* Focus styles for better accessibility */
    .btn:focus {
        outline: 2px solid #1e88e5;
        outline-offset: 2px;
    }

    .btn:focus:not(:focus-visible) {
        outline: none;
    }

    /* Screen reader only class */
    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    /* High contrast mode adjustments */
    @media (forced-colors: active) {
        .message-bubble {
            border: 1px solid CanvasText;
        }
        
        .chat-message.user .message-bubble {
            background-color: Highlight;
            color: HighlightText;
        }
        
        .btn:disabled {
            opacity: 1;
            color: GrayText;
        }
    }

    /* Reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
        .typing-indicator span {
            animation: none;
        }
        
        .chat-input textarea,
        .chat-input button,
        .btn {
            transition: none;
        }
    }

    /* Keep existing animations but wrap in prefers-reduced-motion check */
    @media (prefers-reduced-motion: no-preference) {
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 8px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background-color: #90a4ae;
            border-radius: 50%;
            animation: typing 1s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.3s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    }

    /* Custom scrollbar with better touch support */
    .chat-messages::-webkit-scrollbar {
        width: 6px;
    }

    .chat-messages::-webkit-scrollbar-track {
        background: transparent;
    }

    .chat-messages::-webkit-scrollbar-thumb {
        background-color: rgba(0, 0, 0, 0.2);
        border-radius: 3px;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
        background-color: rgba(0, 0, 0, 0.3);
    }

    @media (pointer: coarse) {
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }
    }
</style>
{% endblock css %}
